name: build web spoofer v0.14.2 qwen3

on:
  workflow_dispatch:
  push:
    branches:
      - build-v0142-qwen3
    paths:
      - 'build_inputs/web-spoofer-v0142-source.part*'
      - '.github/workflows/build-web-spoofer-v0142.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: decode source
        run: |
          mkdir -p build
          cat build_inputs/web-spoofer-v0142-source.part* > build/source.b64
          base64 -d build/source.b64 > build/source.zip
          unzip -t build/source.zip
          cd build
          unzip -q source.zip

      - name: build full local bundle
        run: |
          python build/web-spoofer-v0.14.2-qwen3-local/tools/build_full_bundle.py

      - name: verify extension
        run: |
          test -f build/web-spoofer-v0.14.2-qwen3-local-full.zip
          unzip -t build/web-spoofer-v0.14.2-qwen3-local-full.zip
          sha256sum build/web-spoofer-v0.14.2-qwen3-local-full.zip | tee build/FINAL_SHA256.txt
          unzip -l build/web-spoofer-v0.14.2-qwen3-local-full.zip | grep 'models/Qwen3-0.6B-ONNX/onnx/model_q4f16.onnx'
          unzip -l build/web-spoofer-v0.14.2-qwen3-local-full.zip | grep 'vendor/transformers.min.js'
          python - <<'PY'
          import hashlib, json, zipfile
          path='build/web-spoofer-v0.14.2-qwen3-local-full.zip'
          expected='9e33a5911974174761d0dfdcc0bec975d9c45af0eae5e9eb647b8ba9442a8f91'
          with zipfile.ZipFile(path) as z:
              model=[n for n in z.namelist() if n.endswith('/models/Qwen3-0.6B-ONNX/onnx/model_q4f16.onnx')][0]
              h=hashlib.sha256()
              with z.open(model) as f:
                  while True:
                      b=f.read(8*1024*1024)
                      if not b: break
                      h.update(b)
              actual=h.hexdigest()
              print('model sha256', actual)
              if actual != expected:
                  raise SystemExit('model checksum mismatch')
              manifest=[n for n in z.namelist() if n.endswith('/models/bundle-manifest.json')][0]
              data=json.loads(z.read(manifest))
              if data.get('fully_bundled') is not True:
                  raise SystemExit('bundle manifest not marked fully_bundled')
          PY

      - name: split verified zip for transport
        run: |
          mkdir -p build/split
          split -b 175M -d -a 2 \
            build/web-spoofer-v0.14.2-qwen3-local-full.zip \
            build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part
          test -f build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part00
          test -f build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part01
          test -f build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part02
          test ! -f build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part03
          sha256sum build/split/* | tee build/split/PART_SHA256.txt
          cat > build/split/rebuild.bat <<'BAT'
          @echo off
          setlocal
          echo rebuilding web-spoofer-v0.14.2-qwen3-local-full.zip...
          copy /b web-spoofer-v0.14.2-qwen3-local-full.zip.part00+web-spoofer-v0.14.2-qwen3-local-full.zip.part01+web-spoofer-v0.14.2-qwen3-local-full.zip.part02 web-spoofer-v0.14.2-qwen3-local-full.zip >nul
          if errorlevel 1 (
            echo rebuild failed
            exit /b 1
          )
          echo done
          echo verify with: certutil -hashfile web-spoofer-v0.14.2-qwen3-local-full.zip SHA256
          endlocal
          BAT
          cat build/FINAL_SHA256.txt > build/split/FINAL_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: web-spoofer-v0.14.2-part00
          path: build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part00
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-spoofer-v0.14.2-part01
          path: build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part01
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-spoofer-v0.14.2-part02
          path: build/split/web-spoofer-v0.14.2-qwen3-local-full.zip.part02
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-spoofer-v0.14.2-rebuild
          path: |
            build/split/rebuild.bat
            build/split/PART_SHA256.txt
            build/split/FINAL_SHA256.txt
          compression-level: 0
          retention-days: 7
